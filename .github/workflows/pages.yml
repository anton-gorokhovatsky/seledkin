name: Diagnose meal heading typography
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm exec playwright test tests/browser/meal-diagnostic.spec.mjs --project=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meal-diagnostic
          path: test-results/
