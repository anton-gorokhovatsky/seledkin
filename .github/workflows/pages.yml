name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check static project
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Verify customer journeys in Chromium and WebKit
        run: pnpm run test:browser

      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 14

      - name: Package static files
        run: |
          mkdir -p _site/assets _site/catalog
          cp index.html 404.html robots.txt sitemap.xml .nojekyll _site/
          cp assets/* _site/assets/
          cp catalog/index.html catalog/catalog.js _site/catalog/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
