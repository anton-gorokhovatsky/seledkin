name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check static project
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Choose checks for published changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
          fi
          node scripts/release-scope.mjs "$BASE_SHA"

      - name: Install browser test dependencies
        if: steps.scope.outputs.browser_required == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install browsers
        if: steps.scope.outputs.browser_required == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Verify customer journeys in Chromium and WebKit
        if: steps.scope.outputs.browser_required == 'true'
        env:
          RELEASE_SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [ "$RELEASE_SCOPE" = "journal" ]; then
            pnpm exec playwright test --grep @journal
          else
            pnpm run test:browser
          fi

      - name: Keep browser evidence
        if: always() && steps.scope.outputs.browser_required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 14

      - name: Package static files
        if: steps.scope.outputs.scope != 'none'
        run: |
          mkdir -p _site/assets _site/catalog _site/journal _site/about
          cp index.html 404.html robots.txt sitemap.xml CNAME .nojekyll _site/
          cp yandex_a89bf574e33f8d22.html _site/
          cp assets/* _site/assets/
          cp catalog/index.html catalog/catalog.js _site/catalog/
          cp -R journal/. _site/journal/
          cp about/index.html _site/about/
          node scripts/package-legacy.mjs _site

      - name: Upload Pages artifact
        if: steps.scope.outputs.scope != 'none'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.scope != 'none'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
