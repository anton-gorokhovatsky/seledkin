    <script>
      (() => {
{{baseSetup}}
        document.documentElement.classList.add("js");
        let explicitTheme = null;
        try {
          const stored = localStorage.getItem("seledkin-theme");
          if (stored === "light" || stored === "dark") explicitTheme = stored;
        } catch {}
        let scheduleTheme = null;
        try {
          const schedule = {{themeSchedule}};
          const parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: schedule.timeZone,
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23",
          })
            .formatToParts(new Date());
          const hour = Number(parts.find(({ type }) => type === "hour")?.value);
          const minute = Number(parts.find(({ type }) => type === "minute")?.value);
          const minutes = time => Number(time.slice(0, 2)) * 60 + Number(time.slice(3));
          if (Number.isFinite(hour) && Number.isFinite(minute)) {
            const now = (hour % 24) * 60 + minute;
            scheduleTheme = now >= minutes(schedule.open) && now < minutes(schedule.close) ? "light" : "dark";
          }
        } catch {}
        const theme =
          explicitTheme ??
          scheduleTheme ??
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        const isDark = theme === "dark";
        document.documentElement.dataset.theme = theme;
        if (explicitTheme) {
          document.documentElement.dataset.themeSource = "explicit";
        }
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
{{posterPreload}}
        document.querySelector('meta[name="theme-color"]').content = isDark
          ? "#0e202b"
          : "#ffffff";
      })();
    </script>
