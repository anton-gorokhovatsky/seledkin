    <a class="floating-menu" href="#site-navigation-fallback" aria-label="Перейти к меню сайта" data-menu-fallback-link>
      <span class="floating-menu__mark" aria-hidden="true"></span>
      <span class="floating-menu__label">Меню</span>
    </a>
    <button
      class="floating-menu"
      type="button"
      aria-expanded="false"
      aria-controls="primary-navigation"
      aria-label="Открыть меню"
      data-menu-toggle
      hidden
    >
      <span class="floating-menu__mark" aria-hidden="true"></span>
      <span class="floating-menu__label">Меню</span>
    </button>

    <div
      class="site-menu"
      id="primary-navigation"
      role="dialog"
      aria-modal="true"
      aria-labelledby="menu-title"
      data-menu
      hidden
    >
      <button class="floating-menu" type="button" aria-label="Закрыть меню" data-menu-close>
        <span class="floating-menu__mark" aria-hidden="true"></span>
        <span class="floating-menu__label">Закрыть</span>
      </button>
      <div class="site-menu__panel">
        <header class="site-menu__masthead">
          {{brandOpen}}
            <img
              src="{{root}}assets/logo-redrawn-sea.svg"
              data-theme-logo
              data-logo-light="{{root}}assets/logo-redrawn-sea.svg"
              data-logo-dark="{{root}}assets/logo-redrawn-sea.svg"
              alt="Рыбная лавка капитана Селедкина"
              width="3600"
              height="1784"
            />
          {{brandClose}}
        </header>

        <div class="site-menu__layout">
          <video
            class="site-menu__service-video"
            data-poster-light="{{root}}assets/hero-sea-poster.webp"
            data-poster-dark="{{root}}assets/hero-sea-night-poster.webp"
            data-theme-video
            data-menu-sea-video
            muted
            loop
            playsinline
            preload="none"
            aria-hidden="true"
            tabindex="-1"
          >
            <source
              data-src-light="{{root}}assets/hero-sea-web.mp4"
              data-src-dark="{{root}}assets/hero-sea-night-web.mp4"
              data-theme-video-source
              type="video/mp4"
            />
          </video>
          <section class="site-menu__routes">
            <p class="site-menu__kicker">По сайту</p>
            <h2 id="menu-title">Куда держим курс?</h2>
            <nav aria-label="Меню сайта">
{{routes}}
            </nav>
          </section>

          <section class="site-menu__service" aria-labelledby="menu-service-title">
            <div class="site-menu__service-inner">
              <h3 id="menu-service-title">Ежедневно с&nbsp;11:00 до&nbsp;20:00</h3>
              <address>
                {{menuAddress}}
              </address>
              <div class="site-menu__actions">
                <a
                  class="source-button source-button--menu-call"
                  href="tel:+79166751452"
                  aria-label="Позвонить в лавку: +7 916 675‑14‑52"
                >
                  <span class="source-button__label">Позвонить</span>
                </a>
                <a class="source-button source-button--menu-primary" href="https://t.me/+79166751452">
                  <span class="source-button__label">Заказать в Телеграме</span>
                </a>
                <a class="source-button source-button--menu-secondary" href="https://wa.me/79166751452">
                  <span class="source-button__label">Заказать в WhatsApp</span>
                </a>
              </div>
              <div class="site-menu__networks">
                <a class="site-menu__channel" href="https://t.me/kapitanseledkin">
                  <svg class="site-menu__channel-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <use href="{{root}}assets/social-icons.svg#telegram"></use>
                  </svg>
                  <span class="site-menu__channel-copy">
                    <strong>Телеграм-канал</strong>
                    <span>Судовой журнал капитана</span>
                  </span>
                </a>
                <nav class="site-menu__socials" aria-label="Другие площадки лавки">
                  <a href="https://www.youtube.com/channel/UCPc0ClmcBq3GXT2FAmMQy7A/videos">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <use href="{{root}}assets/social-icons.svg#youtube"></use>
                    </svg>
                    <span>YouTube</span>
                  </a>
                  <a href="https://soundcloud.com/kapitanseledkin">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <use href="{{root}}assets/social-icons.svg#soundcloud"></use>
                    </svg>
                    <span>SoundCloud</span>
                  </a>
                </nav>
              </div>
              <button class="sea-motion-toggle" type="button" data-sea-toggle hidden>Остановить море</button>
              <button
                class="theme-toggle theme-toggle--menu"
                type="button"
                aria-label="Включить ночную вахту"
                data-theme-toggle
              >
                <svg class="theme-toggle__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path class="theme-toggle__moon" d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8a8.5 8.5 0 1 0 11.6 11.6Z" />
                  <g class="theme-toggle__sun">
                    <circle cx="12" cy="12" r="3.5" />
                    <path d="M12 1.5v2M12 20.5v2M1.5 12h2M20.5 12h2M4.6 4.6 6 6M18 18l1.4 1.4M19.4 4.6 18 6M6 18l-1.4 1.4" />
                  </g>
                </svg>
                <span data-theme-label>Ночная вахта</span>
              </button>
            </div>
          </section>
        </div>
      </div>
