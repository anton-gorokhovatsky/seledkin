<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <base href="/" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- shared:theme:start -->
    <script>
      (() => {
        const base = document.querySelector("base");
        base.href = window.location.hostname.endsWith(".github.io")
          ? "/seledkin/"
          : "/";
        document.documentElement.classList.add("js");
        let explicitTheme = null;
        try {
          const stored = localStorage.getItem("seledkin-theme");
          if (stored === "light" || stored === "dark") explicitTheme = stored;
        } catch {}
        let scheduleTheme = null;
        try {
          const schedule = {"timeZone":"Europe/Moscow","open":"11:00","close":"20:00"};
          const parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: schedule.timeZone,
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23",
          })
            .formatToParts(new Date());
          const hour = Number(parts.find(({ type }) => type === "hour")?.value);
          const minute = Number(parts.find(({ type }) => type === "minute")?.value);
          const minutes = time => Number(time.slice(0, 2)) * 60 + Number(time.slice(3));
          if (Number.isFinite(hour) && Number.isFinite(minute)) {
            const now = (hour % 24) * 60 + minute;
            scheduleTheme = now >= minutes(schedule.open) && now < minutes(schedule.close) ? "light" : "dark";
          }
        } catch {}
        const theme =
          explicitTheme ??
          scheduleTheme ??
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        const isDark = theme === "dark";
        document.documentElement.dataset.theme = theme;
        if (explicitTheme) {
          document.documentElement.dataset.themeSource = "explicit";
        }
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = isDark
          ? "#0e202b"
          : "#ffffff";
      })();
    </script>
<!-- shared:theme:end -->
    <!-- shared:analytics:start -->
    <script type="module" src="assets/analytics.js?v=customer-paths-1"></script>
<!-- shared:analytics:end -->
    <link rel="stylesheet" href="assets/styles.css?v=customer-paths-1" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <script type="module" src="assets/theme.js?v=sea-hours-1"></script>
    <script type="module" src="assets/interface-motion.js"></script>
    <script type="module" src="assets/typography.js?v=typography-23-1"></script>
    <title>Страница не найдена — Рыбная лавка капитана Селедкина</title>
  </head>
  <body class="not-found-page">
    <main class="not-found-source">
      <a
        class="not-found-source__brand brand-jelly brand-jelly--page"
        href="./"
        aria-label="Рыбная лавка капитана Селедкина — на главную"
      >
        <img
          src="assets/logo-redrawn-sea.svg"
          data-theme-logo
          data-logo-light="assets/logo-redrawn-sea.svg"
          data-logo-dark="assets/logo-redrawn-sea.svg"
          alt="Рыбная лавка капитана Селедкина"
          width="3600"
          height="1784"
        />
      </a>
      <p class="not-found-source__label">Ошибка 404</p>
      <h1>Такой страницы в лавке нет</h1>
      <p>Вернитесь на главную или откройте полный каталог с ценами.</p>
      <div class="not-found-source__actions">
        <a class="source-button source-button--telegram" href="./"><span class="source-button__label">На главную</span></a>
        <a class="source-button source-button--outline" href="catalog/">
          <span class="source-button__label">Открыть каталог</span>
        </a>
      </div>
      <button
        class="theme-toggle theme-toggle--not-found"
        type="button"
        aria-label="Включить ночную вахту"
        data-theme-toggle
      >
        <svg class="theme-toggle__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="theme-toggle__moon" d="M20.2 15.4A8.5 8.5 0 0 1 8.6 3.8a8.5 8.5 0 1 0 11.6 11.6Z" />
          <g class="theme-toggle__sun">
            <circle cx="12" cy="12" r="3.5" />
            <path d="M12 1.5v2M12 20.5v2M1.5 12h2M20.5 12h2M4.6 4.6 6 6M18 18l1.4 1.4M19.4 4.6 18 6M6 18l-1.4 1.4" />
          </g>
        </svg>
        <span data-theme-label>Ночная вахта</span>
      </button>
    </main>
  </body>
</html>
