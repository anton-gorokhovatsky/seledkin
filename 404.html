    <script>
      (() => {
        const base = document.querySelector("base");
        base.href = window.location.hostname.endsWith(".github.io")
          ? "/seledkin/"
          : "/";
        document.documentElement.classList.add("js");
        let explicitTheme = null;
        try {
          const stored = localStorage.getItem("seledkin-theme");
          if (stored === "light" || stored === "dark") explicitTheme = stored;
        } catch {}
        let scheduleTheme = null;
        try {
          const hourPart = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Moscow",
            hour: "2-digit",
            hourCycle: "h23",
          })
            .formatToParts(new Date())
            .find(({ type }) => type === "hour");
          const hour = Number(hourPart?.value);
          if (Number.isFinite(hour)) {
            scheduleTheme = hour >= 11 && hour < 20 ? "light" : "dark";
          }
        } catch {}
        const theme =
          explicitTheme ??
          scheduleTheme ??
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        const isDark = theme === "dark";
        document.documentElement.dataset.theme = theme;
        if (explicitTheme) {
          document.documentElement.dataset.themeSource = "explicit";
        }
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = isDark
          ? "#0e202b"
          : "#ffffff";
      })();
    </script>
