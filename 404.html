<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <base href="/" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- shared:theme:start -->
    <script>
      (() => {
        const base = document.querySelector("base");
        base.href = window.location.hostname.endsWith(".github.io")
          ? "/seledkin/"
          : "/";
        document.documentElement.classList.add("js");
        let explicitTheme = null;
        try {
          const stored = localStorage.getItem("seledkin-theme");
          if (stored === "light" || stored === "dark") explicitTheme = stored;
        } catch {}
        let scheduleTheme = null;
        try {
          const schedule = {"timeZone":"Europe/Moscow","open":"11:00","close":"20:00"};
          const parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: schedule.timeZone,
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23",
          })
            .formatToParts(new Date());
          const hour = Number(parts.find(({ type }) => type === "hour")?.value);
          const minute = Number(parts.find(({ type }) => type === "minute")?.value);
          const minutes = time => Number(time.slice(0, 2)) * 60 + Number(time.slice(3));
          if (Number.isFinite(hour) && Number.isFinite(minute)) {
            const now = (hour % 24) * 60 + minute;
            scheduleTheme = now >= minutes(schedule.open) && now < minutes(schedule.close) ? "light" : "dark";
          }
        } catch {}
        const theme =
          explicitTheme ??
          scheduleTheme ??
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        const isDark = theme === "dark";
        document.documentElement.dataset.theme = theme;
        if (explicitTheme) {
          document.documentElement.dataset.themeSource = "explicit";
        }
        document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = isDark
          ? "#0e202b"
          : "#ffffff";
      })();
    </script>
<!-- shared:theme:end -->
    <!-- shared:analytics:start -->
    <script type="module" src="assets/analytics.js"></script>
<!-- shared:analytics:end -->
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <script type="module" src="assets/theme.js"></script>
    <script type="module" src="assets/interface-motion.js"></script>
    <script type="module" src="assets/typography.js"></script>
    <title>Страница не найдена — Рыбная лавка капитана Селедкина</title>
    <link rel="stylesheet" href="assets/not-found.css" />
  </head>
  <body class="not-found-page not-found-redesign">

          width="3600"
          height="1784"
        />
      </a>
    </header>
    <main class="not-found-source" id="main">
      <div class="not-found-copy">
        <p class="not-found-source__label">Ошибка 404</p>
        <h1>Такой страницы <em>в лавке нет</em></h1>
        <p class="not-found-description">Откройте каталог с ценами или вернитесь на главную.</p>
        <div class="not-found-source__actions">
          <a class="source-button source-button--telegram" href="catalog/"><span class="source-button__label">Открыть каталог</span></a>
          <a class="editorial-link not-found-home" href="./">На главную<svg viewBox="0 0 32 18" aria-hidden="true" focusable="false"><path d="M23 9H8.5C4.6 9 2.5 10.8 2.5 13.2c0 2.1 1.7 3.4 3.7 2.6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"/><path d="M19.5 3 30 9l-10.5 6 3.1-6-3.1-6Z" fill="currentColor"/></svg></a>
        </div>
      </div>
      <div class="not-found-art" aria-hidden="true"><span class="not-found-art__shoal"></span><span class="not-found-art__code">404</span></div>
    </main>
  </body>
