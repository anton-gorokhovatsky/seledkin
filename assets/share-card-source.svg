<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  role="img"
  aria-labelledby="share-title share-desc"
>
  <title id="share-title">Рыбная лавка капитана Селедкина</title>
  <desc id="share-desc">Свежая рыба со специями, основной синий логотип и обещание лавки</desc>
  <rect width="1200" height="630" fill="#ffffff" />
  <image
    x="0"
    y="0"
    width="630"
    height="630"
    href="about-main.jpg"
    xlink:href="about-main.jpg"
    preserveAspectRatio="xMidYMid meet"
  />
  <image
    x="674"
    y="34"
    width="486"
    height="241"
    href="logo-redrawn.svg"
    xlink:href="logo-redrawn.svg"
    preserveAspectRatio="xMidYMid meet"
  />
  <g fill="#111111" font-family="Iowan Old Style, Palatino Linotype, Palatino, Georgia, serif" font-size="54" font-weight="400">
    <text x="680" y="366">Качественная рыба</text>
    <text x="680" y="421">на каждый день</text>
  </g>
  <g fill="#111111" font-family="Golos Text, Arial, Helvetica, sans-serif" font-size="24" font-weight="500">
    <text x="680" y="489">Морепродукты, икра</text>
    <text x="680" y="525">и рыбные деликатесы в Москве</text>
  </g>
  <text
    x="680"
    y="584"
    fill="#8a6b2f"
    font-family="Golos Text, Arial, Helvetica, sans-serif"
    font-size="16"
    font-weight="700"
    letter-spacing="1.8"
  >МЕТРО «ВАВИЛОВСКАЯ»</text>
</svg>
